[project]
name = "explainable-sez-calibration-framework"
version = "0.4.0"
description = "Demo MVP for explainable SEZ incentive calibration and provisional zone triage."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "streamlit>=1.31",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
